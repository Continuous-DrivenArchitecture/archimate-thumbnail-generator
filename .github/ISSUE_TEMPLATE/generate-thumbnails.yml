name: Generate ArchiMate Thumbnails
description: Generate PNG thumbnails for every view in an ArchiMate model
title: "Generate thumbnails: "
body:
  - type: markdown
    attributes:
      value: |
        Attach exactly one native Archi `.archimate` model file directly—do not put it in a ZIP. Drag the model file into the attachment field and wait until GitHub displays the uploaded filename/link before submitting. Do not paste a link to an external file host.
  - type: input
    id: model-name
    attributes:
      label: Model name
      description: A short name shown in the result comment.
      placeholder: Architecture Model
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Optional context about the model.
    validations:
      required: false
  - type: textarea
    id: attachment
    attributes:
      label: Attachment
      description: Drag and drop the `.archimate` file here, or paste it so GitHub uploads it. Wait until the uploaded filename/link appears before submitting. Do not paste a link to an external file host.
      placeholder: Drag and drop one .archimate model file here
    validations:
      required: false
