name: Generate ArchiMate Thumbnails
description: Generate PNG thumbnails for every view in an ArchiMate model
title: "Generate thumbnails: "
body:
  - type: markdown
    attributes:
      value: |
        The model name is read from the `.archimate` file. Attach exactly one native model file directly—do not put it in a ZIP. Drag the file into the attachment field and wait until GitHub displays the uploaded filename/link before submitting. Do not paste a link to an external file host.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Optional context about the model.
    validations:
      required: false
  - type: textarea
    id: attachment
    attributes:
      label: Attachment
      description: Drag and drop the `.archimate` file here, or paste it so GitHub uploads it. Wait until the uploaded filename/link appears before submitting. Do not paste a link to an external file host.
      placeholder: Drag and drop one .archimate model file here
    validations:
      required: true
