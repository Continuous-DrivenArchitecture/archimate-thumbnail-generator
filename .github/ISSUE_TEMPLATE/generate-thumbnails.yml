name: Generate ArchiMate Thumbnails
description: Generate PNG thumbnails for every view in an ArchiMate model
title: "Generate thumbnails: "
body:
  - type: markdown
    attributes:
      value: |
        GitHub Issues does not accept `.archimate` uploads. Make a copy of your model and rename the copy to end in `.txt` (for example, `model.archimate.txt`); do not edit its contents or put it in a ZIP. Attach that text file directly. The model name is read from its XML contents. Wait until GitHub displays the uploaded filename/link before submitting. Do not paste a link to an external file host.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Optional context about the model.
    validations:
      required: false
  - type: textarea
    id: attachment
    attributes:
      label: Attachment
      description: Drag and drop the `.archimate.txt` copy here, or paste it so GitHub uploads it. Keep the original XML contents unchanged. Wait until the uploaded filename/link appears before submitting.
      placeholder: Drag and drop one .archimate.txt model copy here
    validations:
      required: true
