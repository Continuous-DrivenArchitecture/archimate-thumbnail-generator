name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev
      - name: Integration test with Archi 5.11 and coArchi 0.9.8
        env:
          RUN_ARCHI_INTEGRATION: '1'
        run: npm test
